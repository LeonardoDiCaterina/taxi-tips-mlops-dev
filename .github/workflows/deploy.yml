name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/498336110354/locations/global/workloadIdentityPools/github-actions-pool-v2/providers/github-actions-provider-v2'
          service_account: 'github-deployer-sa@taxi-tips-mlops-dev.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker to use Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./src/proxy
          push: true
          tags: europe-west1-docker.pkg.dev/taxi-tips-mlops-dev/mlops-docker-repo/taxi-tips-api:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run services update taxi-tips-api-dev \
            --image europe-west1-docker.pkg.dev/taxi-tips-mlops-dev/mlops-docker-repo/taxi-tips-api:latest \
            --region europe-west1